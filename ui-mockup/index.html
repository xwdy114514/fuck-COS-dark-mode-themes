<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCTGA 设计稿</title>
<style>
  :root{--bg:#0a0b10;--card:#161922;--line:rgba(255,255,255,.08);
        --txt:#f3f5fa;--sub:#98a0b2;--faint:#5e6577;--a1:#4f7cff;--a2:#9b5cf6}
  *{box-sizing:border-box}
  body{margin:0;padding:22px 18px 50px;color:var(--txt);
       background:radial-gradient(900px 700px at 80% -10%,#1a1526,#0a0b10 62%) fixed;
       font:14px/1.55 -apple-system,"HarmonyOS Sans","Noto Sans SC",sans-serif}
  h1{font-size:18px;margin:0 0 4px}
  p.h{color:var(--sub);font-size:12px;margin:0 0 20px}
  a.card{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
         background:var(--card);border:1px solid var(--line);border-radius:18px;
         padding:16px;margin-bottom:12px}
  a.card:active{border-color:rgba(120,140,255,.5)}
  .n{width:42px;height:42px;border-radius:13px;flex:none;display:flex;align-items:center;
     justify-content:center;font-size:13px;font-weight:700;color:#fff;
     background:linear-gradient(135deg,var(--a1),var(--a2))}
  .n.g{background:linear-gradient(135deg,#3ad6a0,#2f9d7a)}
  .n.w{background:linear-gradient(135deg,#ffb020,#e0761a)}
  .t{font-size:15px;font-weight:600;margin-bottom:3px}
  .d{font-size:12px;color:var(--sub);line-height:1.5}
  .foot{margin-top:22px;font-size:11.5px;color:var(--faint);line-height:1.7}
</style>
</head>
<body>
<h1>MCTGA 设计稿</h1>
<p class="h">点开任意一个，顶部标签可以切换方案。</p>

<a class="card" href="i-version.html">
  <div class="n">I</div>
  <div><div class="t">I 版 · 主题画廊（完整流程）</div>
       <div class="d">挑选中 / 已选 / 交给商店，三个状态一页看完</div></div>
</a>

<a class="card" href="third.html">
  <div class="n g">G·H·I</div>
  <div><div class="t">第三轮</div>
       <div class="d">引导页 / 对话式 / 主题画廊</div></div>
</a>

<a class="card" href="second.html">
  <div class="n w">D·E·F</div>
  <div><div class="t">第二轮（新手向）</div>
       <div class="d">三步向导 / 状态仪表盘 / 列表 + 底栏</div></div>
</a>

<div class="foot">
  这些是 HTML 设计稿，还没写进 app。<br>
  选定后我再改 MainActivity。
</div>
</body>
</html>
